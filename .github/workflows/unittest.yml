name: phpunit

on:
  pull_request:
    paths:
      - 'config/**'
      - 'database/**'
      - 'resources/**'
      - 'src/**'
      - 'tests/**'

env:
  DOCKER_EXMENT_REPOSITORY: congsu1408/docker-exment
  EXMENT_BOILERPLATE_REPOSITORY: exceedone/exment-boilerplate

jobs:
  exment-testing:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql", "mariadb", "sqlsrv"]
        test: ["feature", "unit", "browser"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCKER_EXMENT_REPOSITORY}}
          path: ./docker-exment

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_BOILERPLATE_REPOSITORY}}
          path: ./docker-exment/exment-boilerplate

      - uses: actions/checkout@v4
        with:
          path: ./docker-exment/exment-boilerplate/exment
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Docker Compose Version
        run: docker compose --version

      - name: Make ${{ matrix.db }} up
        working-directory: docker-exment
        run: |
          make ${{ matrix.db }}-up

      - name: Wait for MySQL to be ready
        if: matrix.db == 'mysql'
        working-directory: docker-exment
        run: |
          cid="$(docker compose ps -q mysql)"
          if [ -z "$cid" ]; then
            echo "MySQL container not found" >&2
            docker compose ps
            exit 1
          fi

          for i in $(seq 1 60); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$cid" 2>/dev/null || true)"
            status="$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || true)"

            if [ "$health" = "healthy" ]; then
              exit 0
            fi

            if [ -z "$health" ] && [ "$status" = "running" ]; then
              if docker logs "$cid" 2>/dev/null | tail -n 100 | grep -qi "ready for connections"; then
                exit 0
              fi
            fi

            if [ $((i % 10)) -eq 0 ]; then
              echo "Waiting for MySQL... status=$status health=${health:-n/a} (try $i/60)"
            fi
            sleep 2
          done

          echo "MySQL is not ready after waiting" >&2
          docker compose ps
          docker logs "$cid" | tail -n 200
          exit 1

      - name: Verify MySQL Version
        if: matrix.db == 'mysql'
        working-directory: docker-exment
        run: |
          docker compose exec -T mysql mysql -V
          docker compose exec -T mysql mysqladmin --version || true

      - name: copy compose.dev.json
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php cp composer.dev.json composer.json
          docker compose -f docker-compose.yml exec -T php cp composer.dev.lock composer.lock

      - name: Make ${{ matrix.db }} Initialize
        working-directory: docker-exment
        run: |
          make ${{ matrix.db }}-init

      - name: PHPUnit Test
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php composer run exment:test:${{ matrix.test }}
