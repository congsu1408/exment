name: phpunit

on:
  pull_request:
    paths:
      - 'config/**'
      - 'database/**'
      - 'resources/**'
      - 'src/**'
      - 'tests/**'

env:
  DOCKER_EXMENT_REPOSITORY: congsu1408/docker-exment
  EXMENT_BOILERPLATE_REPOSITORY: exceedone/exment-boilerplate

jobs:
  exment-testing:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql", "mariadb", "sqlsrv"]
        test: ["feature", "unit", "browser"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCKER_EXMENT_REPOSITORY}}
          path: ./docker-exment

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_BOILERPLATE_REPOSITORY}}
          path: ./docker-exment/exment-boilerplate

      - uses: actions/checkout@v4
        with:
          path: ./docker-exment/exment-boilerplate/exment
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Docker Compose Version
        run: docker compose --version

      - name: Make ${{ matrix.db }} up
        working-directory: docker-exment
        run: |
          make ${{ matrix.db }}-up

      - name: Verify MySQL Server Version
        if: matrix.db == 'mysql'
        working-directory: docker-exment
        run: |          
          docker compose -f docker-compose.yml -f docker-compose.mysql.yml \
            exec -T mysql mysql --version

      - name: copy compose.dev.json
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php cp composer.dev.json composer.json
          docker compose -f docker-compose.yml exec -T php cp composer.dev.lock composer.lock

      - name: Initialize (${{ matrix.db }})
        working-directory: docker-exment
        run: |
          if [ "${{ matrix.db }}" = "sqlsrv" ]; then
            sleep 30
            docker compose -f docker-compose.sqlsrv.yml run -T sqlsrv-create-db
          fi

          docker compose -f docker-compose.yml exec -T php chown www-data:www-data -R .
          docker compose -f docker-compose.yml exec -T php sh -lc "git config --global --add safe.directory /var/www/exment; git config --global --add safe.directory /var/www/exment/exment || true"
          docker compose -f docker-compose.yml exec -T -e COMPOSER_PROCESS_TIMEOUT=600 php composer install

          if [ "${{ matrix.db }}" = "mysql" ]; then
            docker compose -f docker-compose.yml exec -T php cp .env.mysql .env
          elif [ "${{ matrix.db }}" = "mariadb" ]; then
            docker compose -f docker-compose.yml exec -T php cp .env.mariadb .env
          elif [ "${{ matrix.db }}" = "sqlsrv" ]; then
            docker compose -f docker-compose.yml exec -T php cp .env.sqlsrv .env
            docker compose -f docker-compose.yml exec -T php sh -lc "printf '\nDB_ENCRYPT=yes\nDB_TRUST_SERVER_CERTIFICATE=yes\n' >> .env"
          fi

          docker compose -f docker-compose.yml exec -T php php artisan key:generate
          docker compose -f docker-compose.yml exec -T php php artisan passport:key --force

      - name: Wait for DB ready
        if: matrix.db == 'mysql' || matrix.db == 'mariadb'
        working-directory: docker-exment
        run: |
          if [ "${{ matrix.db }}" = "mysql" ]; then
            docker compose -f docker-compose.yml -f docker-compose.mysql.yml exec -T mysql sh -lc 'for i in $(seq 1 60); do mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent && exit 0; sleep 2; done; exit 1'
          else
            docker compose -f docker-compose.yml -f docker-compose.mariadb.yml exec -T mariadb sh -lc 'for i in $(seq 1 60); do mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent && exit 0; sleep 2; done; exit 1'
          fi

      - name: PHPUnit Test
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php composer run exment:test:${{ matrix.test }}