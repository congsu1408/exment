name: phpunit

on:
  pull_request:
    paths:
      - 'config/**'
      - 'database/**'
      - 'resources/**'
      - 'src/**'
      - 'tests/**'

env:
  DOCKER_EXMENT_REPOSITORY: congsu1408/docker-exment
  EXMENT_BOILERPLATE_REPOSITORY: exceedone/exment-boilerplate

jobs:
  exment-testing:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql", "mariadb", "sqlsrv"]
        test: ["feature", "unit", "browser"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCKER_EXMENT_REPOSITORY}}
          path: ./docker-exment

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EXMENT_BOILERPLATE_REPOSITORY}}
          path: ./docker-exment/exment-boilerplate

      - uses: actions/checkout@v4
        with:
          path: ./docker-exment/exment-boilerplate/exment
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Docker Compose Version
        run: docker compose --version

      - name: Make ${{ matrix.db }} up
        working-directory: docker-exment
        run: |
          make ${{ matrix.db }}-up

      - name: Wait for MySQL to be ready
        if: matrix.db == 'mysql'
        working-directory: docker-exment
        run: |
          MYSQL_ROOT_PASSWORD="$(docker compose exec -T mysql printenv MYSQL_ROOT_PASSWORD | tr -d '\r')"
          ready=0
          for i in $(seq 1 30); do
            if [ -n "$MYSQL_ROOT_PASSWORD" ]; then
              if docker compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql mysqladmin ping -uroot --silent; then
                ready=1
                break
              fi
            else
              if docker compose exec -T mysql mysqladmin ping -uroot --silent; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "MySQL is not ready after waiting" >&2
            docker compose ps
            exit 1
          fi

      - name: Verify MySQL Version
        if: matrix.db == 'mysql'
        working-directory: docker-exment
        run: |
          docker compose exec -T mysql mysql -V
          MYSQL_ROOT_PASSWORD="$(docker compose exec -T mysql printenv MYSQL_ROOT_PASSWORD | tr -d '\r')"
          if [ -n "$MYSQL_ROOT_PASSWORD" ]; then
            docker compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql mysql -uroot -e "SELECT VERSION();"
          else
            docker compose exec -T mysql mysql -uroot -e "SELECT VERSION();"
          fi

      - name: copy compose.dev.json
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php cp composer.dev.json composer.json
          docker compose -f docker-compose.yml exec -T php cp composer.dev.lock composer.lock

      - name: Make ${{ matrix.db }} Initialize
        working-directory: docker-exment
        run: |
          make ${{ matrix.db }}-init

      - name: PHPUnit Test
        working-directory: docker-exment
        run: |
          docker compose -f docker-compose.yml exec -T php composer run exment:test:${{ matrix.test }}
